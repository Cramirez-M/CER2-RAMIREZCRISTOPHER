{%load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundación Patrimonio Vivo</title>
    
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">
    
    <!-- NAVBAR: Menú principal blanco (bg-white) -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4">
        <div class="container">
            
            <!-- logo clikeable -->
            <a class="navbar-brand text-dark fw-bold" href="{% url 'home' %}">Patrimonio Vivo</a>
            
            <!-- boton hamburguesa -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- MENÚ -->
            <div class="collapse navbar-collapse" id="menuPrincipal">
                
                <!-- ENLACES DE NAVEGACIÓN: me-auto los empuja a la izquierda -->
                <div class="navbar-nav me-auto">
                    <a class="nav-link text-dark fw-bold" href="{% url 'home' %}">Inicio</a>
                    <a class="nav-link text-dark fw-bold" href="{% url 'catalogo' %}">Catálogo</a>
                </div>
                
                
                <div class="d-flex align-items-center">
                    
                    {% if user.is_authenticated %} <!-- Si el usuario inició sesión... -->
                        <span class="me-3">Hola, <strong>{{ user.username }}</strong></span>
                        
                        {% if user.is_staff %} <!-- Solo si es personal (staff) ve este botón -->
                            <a href="{% url 'agregar_lugar' %}" class="btn btn-outline-primary btn-sm me-2">+ Agregar Lugar</a>
                        {% endif %}
                       
                        <form method="post" action="{% url 'logout' %}" class="m-0">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger btn-sm">Cerrar Sesión</button>
                        </form>
                        
                    {% else %} <!-- Si es un visitante anónimo... -->
                        <a href="{% url 'login' %}" class="btn btn-primary btn-sm">Iniciar Sesión</a>
                    {% endif %}
                    
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENEDOR MAESTRO: Aquí Django inyecta los demás archivos HTML -->
    <div class="container">
        {% block contenido %}
        {% endblock %}
    </div>

    <!-- BOOTSTRAP JS: Obligatorio para que funcionen los botones desplegables y el menú móvil -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

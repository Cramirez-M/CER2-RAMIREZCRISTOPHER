<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fundación Patrimonio Vivo</title>
</head>
<body>
    
    <nav style="margin-bottom: 20px;">
    <a href="{% url 'home' %}" style="margin-right: 15px;">Inicio</a>
    <a href="{% url 'catalogo' %}" style="margin-right: 15px;">Catálogo</a>
    
    <!-- La magia ocurre aquí -->
    {% if user.is_authenticated %}
        <strong style="margin-right: 15px;">Hola, {{ user.username }}</strong>
        
        <!-- En Django moderno, cerrar sesión exige un formulario POST por seguridad -->
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit" style="background: red; color: white; padding: 5px;">Cerrar Sesión</button>
        </form>
    {% else %}
        <a href="{% url 'login' %}" style="background: green; color: white; padding: 5px;">Iniciar Sesión</a>
    {% endif %}
</nav>

    <!-- Aquí adentro Django inyectará el contenido de las otras páginas -->
    {% block contenido %}
    {% endblock %}

</body>
</html>

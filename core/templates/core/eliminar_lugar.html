{% extends 'core/base.html' %}

{% block contenido %}
<!-- Centramos  -->
<div class="row justify-content-center mt-5 mb-5">
    <div class="col-md-6 text-center">
        
        <div class="card p-4 shadow-sm border-0">
            <h2 class="fw-bold">¿Estás seguro?</h2>
            <hr>

            <p class="fs-5">Estás a punto de eliminar permanentemente: <strong>{{ lugar.nombre }}</strong>.</p>
            <p class="text-danger fw-semibold">Esta acción no se puede deshacer en la base de datos.</p>

            <!-- Formulario POST para confirmar la eliminación -->
            <form method="post" class="mt-4">
                {% csrf_token %} 
                
                
                <button type="submit" class="btn btn-danger px-4 me-2">
                    Sí, eliminar lugar
                </button>
                
                <!-- Enlace de botón gris para cancelar -->
                <a href="{% url 'catalogo' %}" class="btn btn-primary px-4">
                    Cancelar
                </a>
            </form>
        </div>

    </div>
</div>
{% endblock %}
